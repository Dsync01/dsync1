<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>D.Sync - Etiquetas de Prateleiras</title>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      color: #111;
      background: #f5f5f5;
    }

    .cabecalho {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .acoes {
      display: flex;
      gap: 10px;
    }

    button {
      border: none;
      padding: 11px 18px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
      background: #1a2b4c;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }

    .etiquetas {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .etiqueta {
      background: white;
      border: 1px solid #222;
      padding: 15px;
      text-align: center;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .nome {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .qr {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px auto;
      min-height: 120px;
    }

    .codigo {
      font-size: 14px;
      font-weight: bold;
    }

    .erro {
      background: white;
      padding: 20px;
      border-radius: 8px;
      color: #c0392b;
    }

    @media print {
      body {
        margin: 8mm;
        background: white;
      }

      .no-print {
        display: none !important;
      }

      .etiquetas {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .etiqueta {
        background: white;
      }
    }

    @media screen and (max-width: 600px) {
      .etiquetas {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <div class="cabecalho no-print">
    <div>
      <h2>D.Sync - Etiquetas</h2>
      <span id="totalEtiquetas"></span>
    </div>

    <div class="acoes">
      <button onclick="window.print()">
        🖨️ Imprimir
      </button>

      <button onclick="carregarEtiquetas()">
        🔄 Atualizar
      </button>
    </div>
  </div>

  <div id="etiquetas" class="etiquetas"></div>

  <script>
    const CHAVE_ETIQUETAS = 'dsync_etiquetas_prateleiras';

    function carregarEtiquetas() {
      const container = document.getElementById('etiquetas');

      container.innerHTML = '';

      const dados = localStorage.getItem(CHAVE_ETIQUETAS);

      if (!dados) {
        container.innerHTML = `
          <div class="erro">
            Nenhuma etiqueta encontrada.
            Abra a opção Imprimir Etiquetas no D.Sync.
          </div>
        `;
        return;
      }

      let prateleiras;

      try {
        prateleiras = JSON.parse(dados);
      } catch (erro) {
        console.error(erro);
        container.innerHTML = '<div class="erro">Erro ao carregar etiquetas.</div>';
        return;
      }

      if (!Array.isArray(prateleiras) || !prateleiras.length) {
        container.innerHTML = '<div class="erro">Nenhuma prateleira cadastrada.</div>';
        return;
      }

      document.getElementById('totalEtiquetas').textContent =
        `${prateleiras.length} etiquetas`;

      prateleiras.forEach((p, i) => {
        const etiqueta = document.createElement('div');
        etiqueta.className = 'etiqueta';

        const nome = document.createElement('div');
        nome.className = 'nome';
        nome.textContent = p.nome;

        const qr = document.createElement('div');
        qr.className = 'qr';
        qr.id = `qr-${i}`;

        const codigo = document.createElement('div');
        codigo.className = 'codigo';
        codigo.textContent = p.codigo;

        etiqueta.appendChild(nome);
        etiqueta.appendChild(qr);
        etiqueta.appendChild(codigo);

        container.appendChild(etiqueta);

        new QRCode(qr, {
          text: p.codigo,
          width: 120,
          height: 120,
          colorDark: '#000000',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M
        });
      });
    }

    window.addEventListener('DOMContentLoaded', carregarEtiquetas);
  </script>

</body>
</html>
